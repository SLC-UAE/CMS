<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<script>(function(){try{localStorage.removeItem("slc_theme");}catch(e){}})();</script>
<link rel="icon" type="image/png" href="assets/dubai-crest-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Case Management System – Tadween Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/styles.css?v=2" rel="stylesheet">
</head>
<body>

<div class="login-top-logos">
  <img src="assets/DubaiGov1.png" alt="Government of Dubai" style="height:44px;width:auto;">
  <img src="assets/Tadweenlogo1.png" alt="Tadween Portal" style="height:52px;width:auto;">
  <img src="assets/SLC_logo.png" alt="The Supreme Legislation Committee" style="height:44px;width:auto;">
</div>

<div class="login-shell">
  <div class="login-aside">

    <div style="position:relative;z-index:1;margin-top:220px;">

    </div>
    <div data-en="© 2026 Supreme Legislation Committee, Dubai — An entity of the Government of Dubai. Internal prototype for demonstration purposes." data-ar="جميع الحقوق محفوظة للأمانة العامة للجنة العليا للتشريعات في إمارة دبي © 2026 نظام تدوين لإدراة المعاملات التجريبي" style="position:absolute;bottom:24px;left:64px;font-size:11px;opacity:.85;text-shadow:0 1px 4px rgba(0,0,0,.6);">© 2026 Supreme Legislation Committee, Dubai — An entity of the Government of Dubai. Internal prototype for demonstration purposes.</div>
  </div>

  <div class="login-form-side">
    <div class="lang-switch login-lang-switch">
      <button class="active" id="loginLangEn">EN</button>
      <button id="loginLangAr">AR</button>
    </div>
    <div class="login-card">
      <div class="d-flex justify-content-between align-items-center mb-4">
          <h1 id="loginTitle" data-en="Tadween Portal" data-ar="نظام تدوين لإدارة المعاملات" style="font-size:40px;font-weight:800;line-height:1.25;max-width:480px;text-shadow:0 2px 10px rgba(0,0,0,.55);">Tadween Portal</h1>

        <div class="d-flex gap-2">
          <div class="theme-switch" title="Toggle light / dark theme">
            <button class="active" id="loginThemeLight"><i class="bi bi-sun"></i></button>
            <button id="loginThemeDark"><i class="bi bi-moon-stars"></i></button>
          </div>
          
        </div>
      </div>
     
      <form id="loginForm">
        <div class="mb-3">
          <label class="form-label" data-en="Username" data-ar="اسم المستخدم" style="font-size:12.5px;font-weight:600;">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" value="ahmed.almansoori" required>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" data-en="Password" data-ar="كلمة المرور" style="font-size:12.5px;font-weight:600;">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-white"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" value="••••••••••" required>
          </div>
        </div>
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe" checked>
            <label class="form-check-label" for="rememberMe" data-en="Remember me" data-ar="تذكرني" style="font-size:12.5px;">Remember me</label>
          </div>
          <a href="#" data-en="Forgot password?" data-ar="نسيت كلمة المرور؟" style="font-size:12.5px;">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 mb-3" style="font-size:14px;"><span data-en="Sign In" data-ar="دخول - Login">Sign In</span> <i class="bi bi-arrow-right ms-1"></i></button>
        <button type="button" class="btn w-100 py-2 border d-flex align-items-center justify-content-center gap-2" id="ssoBtn" style="font-size:13px;background:#0A0A0A;color:#fff;border-color:#0A0A0A;">
          <i class="bi bi-patch-check-fill" style="color:#C9A24B;"></i> <span data-en="Sign in with UAE PASS" data-ar="تسجيل الدخول بالهوية الرقمية">Sign in with UAE PASS</span>
        </button>
      </form>

      
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();
  const btn = e.target.querySelector("button[type=submit]");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in...';
  setTimeout(() => { window.location.href = "dashboard.html"; }, 700);
});
document.getElementById("ssoBtn").addEventListener("click", function(){
  this.disabled = true;
  this.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Authenticating via UAE PASS...';
  setTimeout(() => { window.location.href = "dashboard.html"; }, 700);
});
function applyLoginLang(lang){
  document.querySelectorAll("[data-en]").forEach(function(el){
    const val = lang === "ar" ? el.getAttribute("data-ar") : el.getAttribute("data-en");
    if (val) el.textContent = val;
  });
  // Arabic title follows the client's PPT: Arial bold, single line
  const t = document.getElementById("loginTitle").style, ar = lang === "ar";
  t.fontFamily = ar ? "Arial, Tahoma, sans-serif" : "";
  t.fontWeight = ar ? "700" : "800";
  t.fontSize = ar ? "28px" : "40px";
  t.whiteSpace = ar ? "nowrap" : "";
  t.textShadow = ar ? "none" : "0 2px 10px rgba(0,0,0,.55)";}
document.getElementById("loginLangAr").addEventListener("click", function(){
  document.documentElement.setAttribute("dir","rtl");
  document.documentElement.setAttribute("lang","ar");
  this.classList.add("active");
  document.getElementById("loginLangEn").classList.remove("active");
  applyLoginLang("ar");
});
document.getElementById("loginLangEn").addEventListener("click", function(){
  document.documentElement.setAttribute("dir","ltr");
  document.documentElement.setAttribute("lang","en");
  this.classList.add("active");
  document.getElementById("loginLangAr").classList.remove("active");
  applyLoginLang("en");
});
function setLoginTheme(theme){
  try { localStorage.setItem("slc_theme", theme); } catch(e) {}
  document.documentElement.setAttribute("data-theme", theme);
  document.getElementById("loginThemeLight").classList.toggle("active", theme === "light");
  document.getElementById("loginThemeDark").classList.toggle("active", theme === "dark");
}
document.getElementById("loginThemeLight").addEventListener("click", function(){ setLoginTheme("light"); });
document.getElementById("loginThemeDark").addEventListener("click", function(){ setLoginTheme("dark"); });
(function(){
  try { setLoginTheme(localStorage.getItem("slc_theme") === "dark" ? "dark" : "light"); } catch(e) {}
})();
</script>
</body>
</html>
