<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<script>(function(){try{localStorage.removeItem("slc_theme");}catch(e){}})();</script>
<link rel="icon" type="image/png" href="assets/dubai-crest-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Cases — Case Management System – Tadween Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/styles.css?v=2" rel="stylesheet">
<style>
  .lc-progress-bar { width: 76px; height: 7px; background: #F3F4F6; border-radius: 20px; overflow: hidden; }
  .lc-progress-bar .fill { height: 100%; background: linear-gradient(90deg, var(--slc-primary), var(--slc-teal)); border-radius: 20px; }
  [data-theme="dark"] .lc-progress-bar { background: rgba(255,255,255,.08); }
</style>
</head>
<body>

<div id="__pageBody">

  <div class="page-title-row">
    <div>
      <h1 class="page-title" data-en="Live Cases" data-ar="معاملات الجارية">Live Cases</h1>
      <div class="page-subtitle">All registered and active cases currently in progress across SLC directorates.</div>
    </div>
    <div class="page-title-actions">
      <input type="text" class="form-control form-control-sm" id="fSearch" placeholder="Search ref, title, entity..." style="width:220px;">
      <button class="btn btn-light border btn-sm" id="fToggleBtn" data-bs-toggle="collapse" data-bs-target="#fMoreFilters" aria-expanded="false">
        <i class="bi bi-sliders"></i>Filters<i class="bi bi-chevron-down ms-1"></i>
      </button>
      <button class="btn btn-light border btn-sm" id="fResetBtn"><i class="bi bi-arrow-counterclockwise"></i>Reset</button>
      <button class="btn btn-light border" id="exportBtn"><i class="bi bi-download"></i>Export</button>
      <!-- <a href="new-case.html" class="btn btn-primary"><i class="bi bi-plus-lg"></i>New Case</a> -->
    </div>
  </div>

  <!-- Additional filters (collapsed by default) -->
  <div class="collapse" id="fMoreFilters">
    <div class="filter-bar">
      <div class="row g-2 align-items-end">
        <div class="col-lg-2 col-md-3">
          <label>Main Classification</label>
          <select class="form-select form-select-sm" id="fMainClass"><option value="">All Main Classifications</option></select>
        </div>
        <div class="col-lg-2 col-md-3">
          <label>Sub-Classification</label>
          <select class="form-select form-select-sm" id="fCaseType"><option value="">Select main classification first...</option></select>
        </div>
        <div class="col-lg-2 col-md-3">
          <label>Team Leader</label>
          <select class="form-select form-select-sm" id="fLead"><option value="">All Team Leaders</option></select>
        </div>
        <div class="col-lg-2 col-md-3">
          <label>Milestone</label>
          <select class="form-select form-select-sm" id="fMilestone"><option value="">All</option></select>
        </div>
        <div class="col-lg-2 col-md-3">
          <label>Duration From</label>
          <input type="date" class="form-control form-control-sm" id="fDateFrom">
        </div>
        <div class="col-lg-2 col-md-3">
          <label>Duration To</label>
          <input type="date" class="form-control form-control-sm" id="fDateTo">
        </div>
      </div>
    </div>
  </div>

  <!-- Classification accordion (the table card below is moved into the open section by the page script) -->
  <div class="case-accordion" id="lcAccordion">
    <div class="acc-item open" data-code="ALL">
      <button type="button" class="acc-head" aria-expanded="true"><span data-en="All" data-ar="الكل">All</span><i class="bi bi-chevron-down"></i></button>
      <div class="acc-body flush"></div>
    </div>
    <div class="acc-item" data-code="LEG">
      <button type="button" class="acc-head" aria-expanded="false"><span data-en="Legislation (LEG)" data-ar="التشريعات">Legislation (LEG)</span><i class="bi bi-chevron-down"></i></button>
      <div class="acc-body flush"></div>
    </div>
    <div class="acc-item" data-code="LAO">
      <button type="button" class="acc-head" aria-expanded="false"><span data-en="Legal Advice &amp; Opinion (LAO)" data-ar="الفتوى والرأي القانوني">Legal Advice &amp; Opinion (LAO)</span><i class="bi bi-chevron-down"></i></button>
      <div class="acc-body flush"></div>
    </div>
    <div class="acc-item" data-code="TRN">
      <button type="button" class="acc-head" aria-expanded="false"><span data-en="Translation (TRN)" data-ar="الترجمة">Translation (TRN)</span><i class="bi bi-chevron-down"></i></button>
      <div class="acc-body flush"></div>
    </div>
    <div class="acc-item" data-code="GEN">
      <button type="button" class="acc-head" aria-expanded="false"><span data-en="General (GEN)" data-ar="العامة">General (GEN)</span><i class="bi bi-chevron-down"></i></button>
      <div class="acc-body flush"></div>
    </div>
  </div>

  <!-- Table -->
  <div class="table-card" id="lcTableCard">
    <div class="table-scroll">
      <table class="table-modern mb-0" id="liveCasesTable">
        <thead>
          <tr>
            <th class="sortable" data-sort="ref" data-en="Case Ref. No." data-ar="المرجع">Case Ref. No.</th>
            <th class="sortable" data-sort="title" data-en="Case Title" data-ar="عنوان المعاملة">Case Title</th>
            <th class="sortable" data-sort="workType" data-en="Main Classification" data-ar="التصنيف الأساسي">Main Classification</th>
            <th class="sortable" data-sort="lead" data-en="Lead Member" data-ar="قائد المعاملة">Lead Member</th>
            <th class="sortable" data-sort="progressPct" data-en="Progress" data-ar="نسبة الانجاز">Progress</th>
            <th class="sortable" data-sort="pcd" data-en="Proposed Completion" data-ar="موعد الانجاز">Proposed Completion</th>
            <th class="sortable" data-sort="lastActivity" data-en="Last Activity" data-ar="أخر تحديث">Last Activity</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="liveCasesTbody"></tbody>
      </table>
    </div>
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 px-3 py-3 border-top">
      <div class="text-muted-soft" id="lcResultCount" style="font-size:12.3px;"></div>
      <nav>
        <ul class="pagination pagination-sm mb-0" id="lcPagination"></ul>
      </nav>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/app.js"></script>
<script src="js/live-cases.js"></script>
</body>
</html>
