<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<script>(function(){try{localStorage.removeItem("slc_theme");}catch(e){}})();</script>
<link rel="icon" type="image/png" href="assets/dubai-crest-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Cases — Case Management System – Tadween Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/styles.css?v=2" rel="stylesheet">
<style>
  .lc-progress-bar { width: 76px; height: 7px; background: #F3F4F6; border-radius: 20px; overflow: hidden; }
  .lc-progress-bar .fill { height: 100%; background: linear-gradient(90deg, var(--slc-primary), var(--slc-teal)); border-radius: 20px; }
  [data-theme="dark"] .lc-progress-bar { background: rgba(255,255,255,.08); }
</style>
</head>
<body>

<div id="__pageBody">

  <div class="page-title-row">
    <div>
      <h1 class="page-title" data-en="Live Cases" data-ar="القضايا النشطة">Live Cases</h1>
      <div class="page-subtitle">All registered and active cases currently in progress across SLC directorates.</div>
    </div>
    <div class="page-title-actions">
      <input type="text" class="form-control form-control-sm" id="fSearch" placeholder="Search ref, title, entity..." style="width:220px;">
      <button class="btn btn-light border btn-sm" id="fToggleBtn" data-bs-toggle="collapse" data-bs-target="#fMoreFilters" aria-expanded="false">
        <i class="bi bi-sliders"></i>Filters<i class="bi bi-chevron-down ms-1"></i>
      </button>
      <button class="btn btn-light border btn-sm" id="fResetBtn"><i class="bi bi-arrow-counterclockwise"></i>Reset</button>
      <button class="btn btn-light border" id="exportBtn"><i class="bi bi-download"></i>Export</button>
      <!-- <a href="new-case.html" class="btn btn-primary"><i class="bi bi-plus-lg"></i>New Case</a> -->
    </div>
  </div>

  <!-- Additional filters (collapsed by default) -->
  <div class="collapse" id="fMoreFilters">
    <div class="filter-bar">
      <div class="row g-2 align-items-end">
        <div class="col-lg-2 col-md-3">
          <label>Case Type</label>
          <select class="form-select form-select-sm" id="fCaseType"><option value="">All Case Types</option></select>
        </div>
        <div class="col-lg-2 col-md-3">
          <label>Directorate</label>
          <select class="form-select form-select-sm" id="fDirectorate"><option value="">All Directorates</option></select>
        </div>
        <div class="col-lg-2 col-md-3">
          <label>Urgency</label>
          <select class="form-select form-select-sm" id="fUrgency"><option value="">All</option></select>
        </div>
        <div class="col-lg-2 col-md-3">
          <label>Milestone</label>
          <select class="form-select form-select-sm" id="fMilestone"><option value="">All</option></select>
        </div>
        <div class="col-lg-2 col-md-3">
          <label>PCD From</label>
          <input type="date" class="form-control form-control-sm" id="fDateFrom">
        </div>
        <div class="col-lg-2 col-md-3">
          <label>PCD To</label>
          <input type="date" class="form-control form-control-sm" id="fDateTo">
        </div>
      </div>
      <div class="row g-2 align-items-end mt-1">
        <div class="col-lg-3 col-md-4 d-flex align-items-center">
          <div class="form-check form-switch mb-0">
            <input class="form-check-input" type="checkbox" id="fClassified">
            <label class="form-check-label" for="fClassified" style="font-size:12.3px;">Classified cases only</label>
          </div>
        </div>
        <div class="col-lg-3 col-md-4 d-flex align-items-center">
          <div class="form-check form-switch mb-0">
            <input class="form-check-input" type="checkbox" id="fOverdue">
            <label class="form-check-label" for="fOverdue" style="font-size:12.3px;">Overdue only</label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Classification tabs -->
  <div class="tab-nav" id="lcClassTabs">
    <button type="button" class="tab-btn active" data-code="LEG">Legislation (LEG)</button>
    <button type="button" class="tab-btn" data-code="LAO">Legal Advice &amp; Opinion (LAO)</button>
    <button type="button" class="tab-btn" data-code="TRN">Translation (TRN)</button>
    <button type="button" class="tab-btn" data-code="GEN">General (GEN)</button>
  </div>

  <!-- Table -->
  <div class="table-card" style="border-top-left-radius:0;border-top-right-radius:0;">
    <div class="table-scroll">
      <table class="table-modern mb-0" id="liveCasesTable">
        <thead>
          <tr>
            <th class="sortable" data-sort="ref">Case Ref. No.</th>
            <th class="sortable" data-sort="title">Case Title</th>
            <th class="sortable" data-sort="workType">Work Type</th>
            <th class="sortable" data-sort="lead">Lead Member</th>
            <th class="sortable" data-sort="progressPct">Progress</th>
            <th class="sortable" data-sort="pcd">Proposed Completion</th>
            <th class="sortable" data-sort="lastActivity">Last Activity</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="liveCasesTbody"></tbody>
      </table>
    </div>
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 px-3 py-3 border-top">
      <div class="text-muted-soft" id="lcResultCount" style="font-size:12.3px;"></div>
      <nav>
        <ul class="pagination pagination-sm mb-0" id="lcPagination"></ul>
      </nav>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/app.js"></script>
<script src="js/live-cases.js"></script>
</body>
</html>
