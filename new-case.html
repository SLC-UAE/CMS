<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<script>(function(){try{localStorage.removeItem("slc_theme");}catch(e){}})();</script>
<link rel="icon" type="image/png" href="assets/dubai-crest-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register Case — Case Management System – Tadween Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/styles.css?v=2" rel="stylesheet">
<style>
  .form-label-req::after { content: " *"; color: var(--slc-danger); }
  .form-section-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .form-section-sub { font-size: 12px; color: var(--slc-muted); margin-bottom: 16px; }
  .form-label { font-size: 12.2px; font-weight: 600; color:var(--slc-text); margin-bottom: 4px; }
  .form-control, .form-select { font-size: 13px; border-radius: 8px; }
</style>
</head>
<body>
<div id="__pageBody">

  <div class="page-title-row">
    <div>
      <h1 class="page-title" data-en="Register Case" data-ar="تسجيل معاملة">Register Case</h1>
      <div class="page-subtitle">Fields marked with <span class="text-danger">*</span> are required to save the case as pending. Additional fields are required to complete registration.</div>
    </div>
  </div>

  <form id="newCaseForm" onsubmit="return false;">

    <!-- Accordion sections -->
    <div class="case-accordion" id="newCaseAccordion">

      <!-- Case Details -->
      <div class="acc-item open" id="tabCaseDetails">
        <button type="button" class="acc-head" aria-expanded="true"><span data-en="Case Details" data-ar="تفاصيل المعاملة">Case Details</span><i class="bi bi-chevron-down"></i></button>
        <div class="acc-body"><div class="row g-3">
          <div class="col-md-3">
            <div class="form-check form-switch mt-4">
              <input class="form-check-input" type="checkbox" id="fClassified">
              <label class="form-check-label form-label mb-0" for="fClassified">Classified Case</label>
            </div>
          </div>
          <div class="col-md-3">
            <label class="form-label" data-en="Case Ref. No." data-ar="المرجع">Case Ref. No.</label>
            <input type="text" class="form-control" value="Auto-generated on registration" disabled>
          </div>
          <div class="col-md-3">
            <label class="form-label" data-en="System No." data-ar="مرجع النظام">System No.</label>
            <input type="text" class="form-control" value="Auto-generated" disabled>
          </div>
          <div class="col-md-3">
            <label class="form-label" data-en="Old Reference No." data-ar="مرجع النظام القديم">Old Reference No.</label>
            <input type="text" class="form-control" placeholder="For migrated cases only">
          </div>

          <div class="col-md-3">
            <label class="form-label" data-en="Case Start Date (CSD)" data-ar="تاريخ التسجيل">Case Start Date (CSD)</label>
            <input type="date" class="form-control" id="fCsd">
          </div>
          <div class="col-md-3">
            <label class="form-label" data-en="Case Registration Completed Date" data-ar="تاريخ بدء العمل">Case Registration Completed Date</label>
            <input type="text" class="form-control" value="Auto-populated on registration" disabled>
          </div>
          <div class="col-md-3">
            <label class="form-label" data-en="Registered By" data-ar="سجل بواسطة">Registered By</label>
            <input type="text" class="form-control" value="Sara Al Mazrouei (auto)" disabled>
          </div>

          <div class="col-md-3">
            <label class="form-label form-label-req" data-en="Main Classification" data-ar="التصنيف الرئيسي">Main Classification</label>
            <select class="form-select" id="fWorkType" onchange="onWorkTypeChange()">
              <option value="">Select main classification...</option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label form-label-req" data-en="Sub-Classification" data-ar="التصنيف الفرعي">Sub-Classification</label>
            <select class="form-select" id="fCaseType"><option value="">Select main classification first...</option></select>
          </div>
          <div class="col-md-9">
            <label class="form-label form-label-req" data-en="Case Title" data-ar="عنوان المعاملة">Case Title</label>
            <input type="text" class="form-control" placeholder="Enter case title...">
          </div>

          <div class="col-md-3">
            <label class="form-label form-label-req">Proposed Completion Date (PCD)</label>
            <input type="date" class="form-control" id="fPcd">
          </div>
          <div class="col-md-3">
            <label class="form-label">Actual Completion Date (ACD)</label>
            <input type="date" class="form-control" id="fAcd">
          </div>

          <div class="col-12">
            <label class="form-label">Other Details</label>
            <textarea class="form-control" rows="2" placeholder="Additional notes..."></textarea>
          </div>
        </div></div>
      </div>

      <!-- Team Details -->
      <div class="acc-item" id="tabTeamDetails">
        <button type="button" class="acc-head" aria-expanded="false"><span data-en="Team Details" data-ar="فريق العمل">Team Details</span><i class="bi bi-chevron-down"></i></button>
        <div class="acc-body"><div class="row g-3">
          <div class="col-md-6">
            <label class="form-label form-label-req">Head of Directorate</label>
            <select class="form-select" id="fHod"></select>
          </div>
          <div class="col-md-6">
            <label class="form-label form-label-req">Lead Member</label>
            <select class="form-select" id="fLead"></select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Team Members</label>
            <select class="form-select" multiple id="fTeam" size="4"></select>
          </div>
          <div class="col-md-6">
            <label class="form-label form-label-req">Administrators</label>
            <select class="form-select" multiple id="fAdmin" size="4"></select>
          </div>
        </div></div>
      </div>

      <!-- Requesting Entity -->
      <div class="acc-item" id="tabRequestingEntity">
        <button type="button" class="acc-head" aria-expanded="false"><span data-en="Requesting Entity" data-ar="الجهة الحكومية">Requesting Entity</span><i class="bi bi-chevron-down"></i></button>
        <div class="acc-body"><div class="row g-3">
          <div class="col-md-4">
            <label class="form-label form-label-req">Requesting Entity Type</label>
            <select class="form-select">
              <option>Government Entity</option><option>Federal Entity</option><option>Legal Firm</option><option>Individual</option><option>Internal</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label form-label-req">Requesting Entity Name</label>
            <select class="form-select" id="fEntity"></select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Entity Contact</label>
            <input type="text" class="form-control" placeholder="Search entity contact...">
          </div>
          <div class="col-12">
            <label class="form-label">Comments</label>
            <textarea class="form-control" rows="2" placeholder="Requesting entity notes..."></textarea>
          </div>
        </div></div>
      </div>

      <!-- Other Parties -->
      <div class="acc-item" id="tabOtherParties">
        <button type="button" class="acc-head" aria-expanded="false"><span data-en="Other Parties" data-ar="موعد الإنجاز">Other Parties</span><i class="bi bi-chevron-down"></i></button>
        <div class="acc-body"><div class="row g-3">
          <div class="col-md-4">
            <label class="form-label">Related Entity Name</label>
            <select class="form-select" id="fRelEntity"></select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Related Entity Contact</label>
            <input type="text" class="form-control" placeholder="Search entity contact...">
          </div>
          <div class="col-md-4">
            <label class="form-label">Expert</label>
            <input type="text" class="form-control" placeholder="Search expert...">
          </div>
        </div></div>
      </div>

    </div>

    <div id="formAlertBox"></div>

    <div class="d-flex gap-2 justify-content-end flex-wrap pb-4">
      <button type="button" class="btn btn-light border" id="btnReset"><i class="bi bi-arrow-counterclockwise"></i><span data-en="Reset" data-ar="حذف الخانات">Reset</span></button>
      <button type="button" class="btn btn-primary" id="btnSaveRegister"><i class="bi bi-check2-circle"></i><span data-en="Register" data-ar="تسجيل">Register</span></button>
    </div>

  </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/app.js"></script>
<script src="js/new-case.js"></script>
</body>
</html>
