<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<script>(function(){try{localStorage.removeItem("slc_theme");}catch(e){}})();</script>
<link rel="icon" type="image/png" href="assets/dubai-crest-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Approvals — Case Management System – Tadween Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/styles.css?v=2" rel="stylesheet">
</head>
<body>

<div id="__pageBody">

  <div class="page-title-row">
    <div>
      <h1 class="page-title" data-en="My Approvals" data-ar="الاعتمادات">My Approvals</h1>
      <div class="page-subtitle" data-en="Cases currently awaiting your sign-off at their current workflow stage." data-ar="صفحة المعاملات التي بانتظار الاعتماد للفتح والاغلاق.">Cases currently awaiting your sign-off at their current workflow stage.</div>
    </div>
    <div class="page-title-actions">
      <input type="text" class="form-control form-control-sm" id="fSearch" placeholder="Search ref, title, stage..." style="width:240px;">
      <button class="btn btn-light border btn-sm" id="fResetBtn"><i class="bi bi-arrow-counterclockwise"></i><span data-en="Reset" data-ar="تنشيط">Reset</span></button>
    </div>
  </div>

  <!-- Table -->
  <div class="table-card">
    <div class="table-scroll">
      <table class="table-modern mb-0" id="myApprovalsTable">
        <thead>
          <tr>
            <th class="sortable" data-sort="ref" data-en="Case Ref. No." data-ar="المرجع">Case Ref. No.</th>
            <th class="sortable" data-sort="title" data-en="Case Title" data-ar="عنوان المعاملة">Case Title</th>
            <th class="sortable" data-sort="workType" data-en="Classification" data-ar="التصنيف الأساسي">Classification</th>
            <th class="sortable" data-sort="stage" data-en="Approval Stage" data-ar="الحالة">Approval Stage</th>
            <th class="sortable" data-sort="submitted" data-en="Submitted" data-ar="تاريخ">Submitted</th>
            <th class="sortable" data-sort="by" data-en="Pending With" data-ar="عالقة لدى">Pending With</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="myApprovalsTbody"></tbody>
      </table>
    </div>
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 px-3 py-3 border-top">
      <div class="text-muted-soft" id="maResultCount" style="font-size:12.3px;"></div>
      <nav>
        <ul class="pagination pagination-sm mb-0" id="maPagination"></ul>
      </nav>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/app.js"></script>
<script src="js/my-approvals.js"></script>
</body>
</html>
