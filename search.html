<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<script>(function(){try{localStorage.removeItem("slc_theme");}catch(e){}})();</script>
<link rel="icon" type="image/png" href="assets/dubai-crest-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Database Search — Case Management System – Tadween Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/styles.css?v=2" rel="stylesheet">
<style>
  .search-hero {
    background: linear-gradient(135deg, #001E3C 0%, #003D6B 45%, #0033A0 75%, #0033A0 100%);
    border-radius: var(--slc-radius); padding: 32px 32px 26px; margin-bottom: 18px; position: relative; overflow: hidden;
  }
  .search-hero::before {
    content: ""; position: absolute; inset: 0; opacity: .12;
    background-image: radial-gradient(circle at 15% 25%, #fff 1px, transparent 1px), radial-gradient(circle at 85% 65%, #fff 1px, transparent 1px);
    background-size: 38px 38px;
  }
  .search-hero-inner { position: relative; z-index: 1; }
  .search-hero h1 { color: #fff; font-size: 21px; font-weight: 700; margin-bottom: 4px; }
  .search-hero p { color: rgba(255,255,255,.85); font-size: 12.8px; margin-bottom: 18px; }
  .search-hero-box { background: #fff; border-radius: 12px; padding: 6px; display: flex; align-items: center; gap: 8px; box-shadow: var(--slc-shadow-lg); }
  .search-hero-box i.bi-search { color: var(--slc-muted); font-size: 18px; margin-left: 10px; }
  .search-hero-box input { flex: 1; border: none; outline: none; font-size: 15px; padding: 10px 4px; }
  .result-count { font-size: 12.5px; color: var(--slc-muted); }
  .filter-toggle-btn { font-size: 12.5px; }
</style>
</head>
<body>

<div id="__pageBody">

  <div class="search-hero">
    <div class="search-hero-inner">
      <h1 data-en="Database Search" data-ar="بحث قاعدة البيانات الشاملة">Database Search</h1>
      <p>Search across all SLC cases, documents, activities and entities.</p>
      <div class="search-hero-box">
        <i class="bi bi-search"></i>
        <input type="text" id="heroSearchInput" placeholder="Search by case reference, title, entity, keyword..." data-en-ph="Search by case reference, title, entity, keyword..." data-ar-ph="البحث عن طريق عنوان المعاملة، المرجع، إلخ">
        <button class="btn btn-primary" id="heroSearchBtn"><i class="bi bi-search"></i><span data-en="Search" data-ar="بحث">Search</span></button>
      </div>
    </div>
  </div>

  <div id="standardPane">

    <div class="filter-bar">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <div class="fw-bold" style="font-size:13.5px;"><i class="bi bi-funnel me-1"></i>Advanced Filters</div>
        <button class="btn btn-sm btn-light border filter-toggle-btn" id="clearFiltersBtn"><i class="bi bi-x-circle"></i>Clear Filters</button>
      </div>
      <div class="row g-2">
        <div class="col-md-3">
          <label data-en="Case Ref. No." data-ar="المرجع">Case Ref. No.</label>
          <input type="text" class="form-control" id="fRef" placeholder="e.g. TRS-AT-2026-95">
        </div>
        <div class="col-md-3">
          <label data-en="Case Title" data-ar="عنوان المعاملة">Case Title</label>
          <input type="text" class="form-control" id="fTitle" placeholder="Keyword in title">
        </div>
        <div class="col-md-3">
          <label data-en="Main Classification" data-ar="التصنيف الرئيسي">Main Classification</label>
          <select class="form-select" id="fWorkType"><option value="">All Main Classifications</option></select>
        </div>
        <div class="col-md-3">
          <label data-en="Sub-Classification" data-ar="التصنيف الفرعي">Sub-Classification</label>
          <select class="form-select" id="fCaseType"><option value="">All Sub-Classifications</option></select>
        </div>
        <div class="col-md-3">
          <label data-en="Requesting Entity" data-ar="الجهة الحكومية">Requesting Entity</label>
          <select class="form-select" id="fEntity"><option value="">All Entities</option></select>
        </div>
        <div class="col-md-3">
          <label data-en="Case Activities Keyword" data-ar="كلمات مفتاحية">Case Activities Keyword</label>
          <input type="text" class="form-control" id="fActivity" placeholder="e.g. translation, review">
        </div>
        <div class="col-md-3">
          <label data-en="Documents Keyword" data-ar="بحث المرفقات">Documents Keyword</label>
          <input type="text" class="form-control" id="fDoc" placeholder="e.g. draft, gazette">
        </div>
        <div class="col-md-3">
          <label data-en="Team Members" data-ar="عضو فريق">Team Members</label>
          <select class="form-select" id="fTeam"><option value="">Any Team Member</option></select>
        </div>
        <div class="col-md-3">
          <label data-en="Old Reference No." data-ar="المرجع القديم">Old Reference No.</label>
          <input type="text" class="form-control" id="fOldRef" placeholder="Not tracked for pre-migration cases">
        </div>
        <div class="col-md-3 d-flex align-items-end">
          <button class="btn btn-primary w-100" id="runSearchBtn"><i class="bi bi-search"></i><span data-en="Search" data-ar="بحث">Search</span></button>
        </div>
      </div>
    </div>

    <div class="table-card">
      <div class="d-flex align-items-center justify-content-between px-3 pt-3">
        <div class="result-count" id="resultCount">— cases found</div>
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-light border" onclick="SLCApp.demoActionModal('Search saved successfully in prototype mode.')"><i class="bi bi-bookmark"></i>Save Search</button>
          <button class="btn btn-sm btn-light border" onclick="SLCApp.toast('Report exported successfully – Demo Mode')"><i class="bi bi-download"></i>Export</button>
        </div>
      </div>
      <div class="table-scroll mt-2">
        <table class="table-modern mb-0" id="resultsTable">
          <thead>
            <tr>
              <th class="sortable" data-sort="ref" data-en="Case Ref." data-ar="المرجع">Case Ref.</th>
              <th class="sortable" data-sort="title" data-en="Title" data-ar="عنوان المعاملة">Title</th>
              <th class="sortable" data-sort="workType" data-en="Main Classification / Sub-Classification" data-ar="التصنيف الأساسي">Main Classification / Sub-Classification</th>
              <th class="sortable" data-sort="requestingEntity" data-en="Requesting Entity" data-ar="الجهة الحكومية">Requesting Entity</th>
              <th class="sortable" data-sort="milestone" data-en="Current Workflow Stage" data-ar="مرحلة المعاملة">Current Workflow Stage</th>
              <th class="sortable" data-sort="pcd" data-en="PCD" data-ar="موعد الانجاز">PCD</th>
              <th class="sortable" data-sort="status" data-en="Status" data-ar="الحالة">Status</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/app.js"></script>
<script src="js/search.js"></script>
</body>
</html>
