<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<script>(function(){try{localStorage.removeItem("slc_theme");}catch(e){}})();</script>
<link rel="icon" type="image/png" href="assets/dubai-crest-icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — Case Management System – Tadween Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/styles.css?v=2" rel="stylesheet">
<style>
  .report-card { background: #fff; border: 1px solid var(--slc-border); border-radius: var(--slc-radius); box-shadow: var(--slc-shadow-sm); padding: 16px 18px; height: 100%; display: flex; flex-direction: column; }
  .report-card .rc-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; margin-bottom: 12px; }
  .report-card .rc-name { font-weight: 700; font-size: 14px; color: var(--slc-text); margin-bottom: 4px; }
  .report-card .rc-desc { font-size: 12.3px; color: var(--slc-muted); flex: 1; margin-bottom: 14px; line-height: 1.45; }
  .report-card .rc-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .report-group-title { font-size: 15px; font-weight: 700; color: var(--slc-text); margin: 22px 0 12px; display: flex; align-items: center; gap: 8px; }
  .report-group-title:first-of-type { margin-top: 0; }
  .chart-type-tag { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--slc-muted); background: #F3F4F6; padding: 2px 8px; border-radius: 6px; }

  [data-theme="dark"] .report-card { background: var(--slc-card); }
  [data-theme="dark"] .chart-type-tag { background: rgba(255,255,255,.08); }
</style>
</head>
<body>

<div id="__pageBody">

  <div class="page-title-row">
    <div>
      <h1 class="page-title" data-en="Reports" data-ar="تقارير">Reporting Center</h1>
      <div class="page-subtitle">Generate, view and export case and operational reports across SLC directorates.</div>
    </div>
    <div class="page-title-actions">
      <div class="dropdown">
        <button class="btn btn-light border dropdown-toggle" data-bs-toggle="dropdown"><i class="bi bi-download"></i>Export</button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="#" onclick="event.preventDefault();SLCApp.toast('Report exported successfully – Demo Mode');"><i class="bi bi-file-earmark-excel me-2" style="color:#107C10;"></i>Export to Excel</a></li>
          <li><a class="dropdown-item" href="#" onclick="event.preventDefault();SLCApp.toast('Report exported successfully – Demo Mode');"><i class="bi bi-file-earmark-pdf me-2" style="color:#B91C1C;"></i>Export to PDF</a></li>
        </ul>
      </div>
      <button class="btn btn-primary" onclick="SLCApp.demoActionModal('Custom report builder is a demonstration capability in this prototype.')"><i class="bi bi-plus-lg"></i>New Custom Report</button>
    </div>
  </div>

  <div id="reportGroups"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/demo-data.js"></script>
<script src="js/app.js"></script>
<script src="js/reports.js"></script>
</body>
</html>
